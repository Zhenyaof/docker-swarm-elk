version: "3.8"

services:
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3

    environment:
      - ELASTICSEARCH_HOSTS=http://192.168.198.144:9200

    volumes:
      - /opt/elk/kibana:/usr/share/kibana/data

    networks:
      - elk_net

    ports:
      - "5601:5601"

    deploy:
      placement:
        constraints:
          - node.labels.role == worker1

      restart_policy:
        condition: on-failure

networks:
  elk_net:
    external: true